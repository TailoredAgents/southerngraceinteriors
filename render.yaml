services:
  - type: web
    name: southern-grace-interiors
    runtime: node
    # Intentionally omitted: Render preserves the paid compute plan selected
    # in the dashboard instead of forcing a Blueprint plan change.
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: SITE_URL
        value: https://southern-grace-interiors.onrender.com
      - key: SITE_INDEXABLE
        value: "false"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
